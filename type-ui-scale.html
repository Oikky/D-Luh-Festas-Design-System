<!-- @dsCard group="Shape" viewport="700x150" name="Borders & focus" subtitle="1px hairline, 1.5px control, 2px tab underline" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Borders</title><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px 20px;background:var(--color-bg);font-family:var(--font-ui);color:var(--text-strong)}.row{display:flex;gap:10px;flex-wrap:wrap}.lbl{font-size:10.5px;font-weight:600;color:var(--text-muted);letter-spacing:.4px;text-transform:uppercase}.mono{font-family:var(--font-ui);font-variant-numeric:tabular-nums}</style></head><body><div class="row" style="gap:12px;align-items:center">
<div style="padding:12px 16px;border:1px solid var(--color-border);border-radius:var(--radius-sm);font-size:12.5px">1px hairline</div>
<div style="padding:12px 16px;border:1.5px solid var(--color-accent);color:var(--color-accent);border-radius:var(--radius-sm);font-size:12.5px;font-weight:600">1.5px control</div>
<div style="padding:12px 4px;border-bottom:2px solid var(--color-accent);color:var(--color-accent);font-size:13.5px;font-weight:600">2px tab</div>
<div style="padding:12px 16px;border:1px solid var(--color-accent);border-radius:var(--radius-sm);box-shadow:var(--focus-ring);font-size:12.5px">focus ring</div>
</div></body></html>
