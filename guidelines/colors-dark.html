<!-- @dsCard group="Colors" viewport="700x160" name="Dark theme" subtitle="data-theme=&quot;dark&quot; — night surfaces, terracotta kept as accent" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Dark</title><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px 20px;background:var(--color-bg);font-family:var(--font-ui);color:var(--text-strong)}.row{display:flex;gap:10px;flex-wrap:wrap}.lbl{font-size:10.5px;font-weight:600;color:var(--text-muted);letter-spacing:.4px;text-transform:uppercase}.mono{font-family:var(--font-ui);font-variant-numeric:tabular-nums}</style></head><body><div data-theme="dark" style="background:var(--color-bg);padding:16px;border-radius:var(--radius-md);margin:-4px 0">
<div class="row" style="gap:6px">
<div style="flex:1;min-width:64px"><div style="height:48px;border-radius:var(--radius-xs);background:var(--night-950);border:1px solid rgba(255,255,255,.1)"></div><div style="margin-top:5px;font-size:10px;font-weight:600;color:#b9b4b0;text-align:center">bg</div></div><div style="flex:1;min-width:64px"><div style="height:48px;border-radius:var(--radius-xs);background:var(--night-900);border:1px solid rgba(255,255,255,.1)"></div><div style="margin-top:5px;font-size:10px;font-weight:600;color:#b9b4b0;text-align:center">surface</div></div><div style="flex:1;min-width:64px"><div style="height:48px;border-radius:var(--radius-xs);background:var(--night-850);border:1px solid rgba(255,255,255,.1)"></div><div style="margin-top:5px;font-size:10px;font-weight:600;color:#b9b4b0;text-align:center">surface-2</div></div><div style="flex:1;min-width:64px"><div style="height:48px;border-radius:var(--radius-xs);background:var(--night-800);border:1px solid rgba(255,255,255,.1)"></div><div style="margin-top:5px;font-size:10px;font-weight:600;color:#b9b4b0;text-align:center">surface-3</div></div><div style="flex:1;min-width:64px"><div style="height:48px;border-radius:var(--radius-xs);background:var(--color-accent);border:1px solid rgba(255,255,255,.1)"></div><div style="margin-top:5px;font-size:10px;font-weight:600;color:#b9b4b0;text-align:center">accent</div></div><div style="flex:1;min-width:64px"><div style="height:48px;border-radius:var(--radius-xs);background:var(--text-strong);border:1px solid rgba(255,255,255,.1)"></div><div style="margin-top:5px;font-size:10px;font-weight:600;color:#b9b4b0;text-align:center">text</div></div>
</div>
<div style="margin-top:12px;display:flex;gap:8px;align-items:center"><span style="padding:8px 14px;border-radius:var(--radius-sm);background:var(--color-accent);color:var(--color-accent-contrast);font-size:12.5px;font-weight:600">Confirmar</span><span style="padding:4px 12px;border-radius:var(--radius-pill);background:var(--status-preparo-bg);color:var(--status-preparo-fg);font-size:11.5px;font-weight:600">Em produção</span></div>
</div></body></html>
