<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Radii</title><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px 20px;background:var(--color-bg);font-family:var(--font-ui);color:var(--text-strong)}.row{display:flex;gap:10px;flex-wrap:wrap}.lbl{font-size:10.5px;font-weight:600;color:var(--text-muted);letter-spacing:.4px;text-transform:uppercase}.mono{font-family:var(--font-ui);font-variant-numeric:tabular-nums}</style></head><body><div class="row" style="gap:12px">
<div style="text-align:center"><div style="width:74px;height:56px;border-radius:var(--radius-xs);background:var(--color-surface);border:1.5px solid var(--color-accent)"></div><div style="font-size:11px;font-weight:600;margin-top:6px">6px</div><div style="font-size:9.5px;color:var(--text-muted);max-width:76px">inputs, menu items</div></div><div style="text-align:center"><div style="width:74px;height:56px;border-radius:var(--radius-sm);background:var(--color-surface);border:1.5px solid var(--color-accent)"></div><div style="font-size:11px;font-weight:600;margin-top:6px">8px</div><div style="font-size:9.5px;color:var(--text-muted);max-width:76px">buttons</div></div><div style="text-align:center"><div style="width:74px;height:56px;border-radius:var(--radius-md);background:var(--color-surface);border:1.5px solid var(--color-accent)"></div><div style="font-size:11px;font-weight:600;margin-top:6px">12px</div><div style="font-size:9.5px;color:var(--text-muted);max-width:76px">icon tiles, dropdown</div></div><div style="text-align:center"><div style="width:74px;height:56px;border-radius:var(--radius-lg);background:var(--color-surface);border:1.5px solid var(--color-accent)"></div><div style="font-size:11px;font-weight:600;margin-top:6px">16px</div><div style="font-size:9.5px;color:var(--text-muted);max-width:76px">cards, modals</div></div><div style="text-align:center"><div style="width:74px;height:56px;border-radius:var(--radius-xl);background:var(--color-surface);border:1.5px solid var(--color-accent)"></div><div style="font-size:11px;font-weight:600;margin-top:6px">20px</div><div style="font-size:9.5px;color:var(--text-muted);max-width:76px">hero panels</div></div><div style="text-align:center"><div style="width:74px;height:56px;border-radius:var(--radius-pill);background:var(--color-surface);border:1.5px solid var(--color-accent)"></div><div style="font-size:11px;font-weight:600;margin-top:6px">999px</div><div style="font-size:9.5px;color:var(--text-muted);max-width:76px">badges, filters</div></div>
</div></body></html>
