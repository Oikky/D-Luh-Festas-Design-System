<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Spacing</title><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px 20px;background:var(--color-bg);font-family:var(--font-ui);color:var(--text-strong)}.row{display:flex;gap:10px;flex-wrap:wrap}.lbl{font-size:10.5px;font-weight:600;color:var(--text-muted);letter-spacing:.4px;text-transform:uppercase}.mono{font-family:var(--font-ui);font-variant-numeric:tabular-nums}</style></head><body><div style="display:flex;align-items:flex-end;gap:8px">
<div style="text-align:center"><div style="width:var(--space-1);height:10.2px;background:var(--color-accent);border-radius:2px;min-width:2px"></div><div style="font-size:9.5px;color:var(--text-muted);margin-top:5px">2</div></div><div style="text-align:center"><div style="width:var(--space-2);height:12.4px;background:var(--color-accent);border-radius:2px;min-width:2px"></div><div style="font-size:9.5px;color:var(--text-muted);margin-top:5px">4</div></div><div style="text-align:center"><div style="width:var(--space-3);height:14.600000000000001px;background:var(--color-accent);border-radius:2px;min-width:2px"></div><div style="font-size:9.5px;color:var(--text-muted);margin-top:5px">6</div></div><div style="text-align:center"><div style="width:var(--space-4);height:16.8px;background:var(--color-accent);border-radius:2px;min-width:2px"></div><div style="font-size:9.5px;color:var(--text-muted);margin-top:5px">8</div></div><div style="text-align:center"><div style="width:var(--space-5);height:19px;background:var(--color-accent);border-radius:2px;min-width:2px"></div><div style="font-size:9.5px;color:var(--text-muted);margin-top:5px">10</div></div><div style="text-align:center"><div style="width:var(--space-6);height:21.200000000000003px;background:var(--color-accent);border-radius:2px;min-width:2px"></div><div style="font-size:9.5px;color:var(--text-muted);margin-top:5px">12</div></div><div style="text-align:center"><div style="width:var(--space-7);height:23.400000000000002px;background:var(--color-accent);border-radius:2px;min-width:2px"></div><div style="font-size:9.5px;color:var(--text-muted);margin-top:5px">14</div></div><div style="text-align:center"><div style="width:var(--space-8);height:25.6px;background:var(--color-accent);border-radius:2px;min-width:2px"></div><div style="font-size:9.5px;color:var(--text-muted);margin-top:5px">16</div></div><div style="text-align:center"><div style="width:var(--space-9);height:27.8px;background:var(--color-accent);border-radius:2px;min-width:2px"></div><div style="font-size:9.5px;color:var(--text-muted);margin-top:5px">18</div></div><div style="text-align:center"><div style="width:var(--space-10);height:30px;background:var(--color-accent);border-radius:2px;min-width:2px"></div><div style="font-size:9.5px;color:var(--text-muted);margin-top:5px">20</div></div><div style="text-align:center"><div style="width:var(--space-11);height:34.400000000000006px;background:var(--color-accent);border-radius:2px;min-width:2px"></div><div style="font-size:9.5px;color:var(--text-muted);margin-top:5px">24</div></div><div style="text-align:center"><div style="width:var(--space-12);height:43.2px;background:var(--color-accent);border-radius:2px;min-width:2px"></div><div style="font-size:9.5px;color:var(--text-muted);margin-top:5px">32</div></div><div style="text-align:center"><div style="width:var(--space-13);height:52px;background:var(--color-accent);border-radius:2px;min-width:2px"></div><div style="font-size:9.5px;color:var(--text-muted);margin-top:5px">40</div></div><div style="text-align:center"><div style="width:var(--space-14);height:60px;background:var(--color-accent);border-radius:2px;min-width:2px"></div><div style="font-size:9.5px;color:var(--text-muted);margin-top:5px">60</div></div>
</div></body></html>
