<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerador de Contratos</title>
<style>
:root{
  --areia:#f7e0cc; --areia-fraca:#fdf3ea; --tinta:#33302e; --tinta-fraca:#6b6560;
  --linha:#e2dcd6; --fundo:#f2efec; --branco:#fff; --acento:#b8794a; --acento-esc:#8f5a33;
  --ok:#2f7d4f; --alerta:#b3541e; --erro:#b4342b;
  --painel:400px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:"Segoe UI",system-ui,-apple-system,sans-serif; font-size:14px;
  color:var(--tinta); background:var(--fundo); overflow:hidden;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- barra superior ---------- */
#barra{
  display:flex; align-items:center; gap:8px; padding:8px 12px; height:56px;
  background:var(--branco); border-bottom:1px solid var(--linha); position:relative; z-index:30;
}
#barra .marca{font-weight:700;letter-spacing:.02em;white-space:nowrap;margin-right:6px}
#barra .marca small{display:block;font-weight:400;font-size:11px;color:var(--tinta-fraca);letter-spacing:0}
#barra .espaco{flex:1}
.btn{
  border:1px solid var(--linha); background:var(--branco); color:var(--tinta);
  padding:7px 12px; border-radius:7px; white-space:nowrap; display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{background:var(--areia-fraca);border-color:var(--areia)}
.btn.primario{background:var(--acento);border-color:var(--acento);color:#fff;font-weight:600}
.btn.primario:hover{background:var(--acento-esc);border-color:var(--acento-esc)}
.btn.perigo:hover{background:#fdecea;border-color:#f0b8b3;color:var(--erro)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pequeno{padding:4px 8px;font-size:12px;border-radius:6px}
#estadoSalvo{font-size:12px;color:var(--tinta-fraca);min-width:118px;text-align:right}

/* ---------- layout ---------- */
#corpo{display:flex;height:calc(100% - 56px)}
#painel{
  width:var(--painel); min-width:300px; max-width:60vw; flex:0 0 auto;
  background:var(--branco); border-right:1px solid var(--linha); overflow-y:auto; overscroll-behavior:contain;
}
#puxador{width:6px;flex:0 0 auto;cursor:col-resize;background:transparent}
#puxador:hover{background:var(--areia)}
#visor{flex:1;overflow:auto;background:var(--fundo);position:relative;padding:18px 0 60px}

/* ---------- formulário ---------- */
.secao{border-bottom:1px solid var(--linha)}
.secao>summary{
  list-style:none; cursor:pointer; padding:11px 14px; font-weight:600; font-size:13px;
  display:flex; align-items:center; gap:8px; user-select:none; background:var(--branco);
  position:sticky; top:0; z-index:2;
}
.secao>summary::-webkit-details-marker{display:none}
.secao>summary:hover{background:var(--areia-fraca)}
.secao>summary::before{content:"▸";color:var(--acento);transition:transform .12s;display:inline-block}
.secao[open]>summary::before{transform:rotate(90deg)}
.secao>summary .conta{
  margin-left:auto; font-weight:400; font-size:11px; color:#fff; background:var(--alerta);
  border-radius:10px; padding:1px 7px;
}
.secao>summary .conta:empty{display:none}
.grade{padding:4px 14px 16px;display:grid;grid-template-columns:repeat(12,1fr);gap:10px 8px}
.campo{grid-column:span 12;display:flex;flex-direction:column;gap:3px;min-width:0}
.campo.c6{grid-column:span 6}
.campo.c4{grid-column:span 4}
.campo.c8{grid-column:span 8}
.campo.c3{grid-column:span 3}
.campo.c9{grid-column:span 9}
.campo>label{font-size:11.5px;color:var(--tinta-fraca);font-weight:500;display:flex;gap:4px;align-items:center}
.campo>label .obrig{color:var(--alerta)}
.campo input,.campo select,.campo textarea{
  border:1px solid var(--linha); border-radius:6px; padding:7px 8px; background:var(--branco); width:100%;
}
.campo input:focus,.campo select:focus,.campo textarea:focus{
  outline:none;border-color:var(--acento);box-shadow:0 0 0 2px rgba(184,121,74,.15)
}
.campo textarea{resize:vertical;min-height:74px;line-height:1.45}
.campo.faltando input,.campo.faltando textarea,.campo.faltando select{background:#fffbf0;border-color:#e8c99a}
.campo .dica{font-size:11px;color:var(--tinta-fraca)}
.campo .dica.ruim{color:var(--erro)}
.campo .dica.bom{color:var(--ok)}
.linha-btns{grid-column:span 12;display:flex;gap:6px;flex-wrap:wrap}
.aviso{
  grid-column:span 12; background:var(--areia-fraca); border:1px solid var(--areia);
  border-radius:7px; padding:8px 10px; font-size:12px; line-height:1.45;
}

/* ---------- visor / folhas ---------- */
#zoomBarra{
  position:sticky; top:0; z-index:12; display:flex; gap:6px; align-items:center; justify-content:center;
  padding:0 0 12px; pointer-events:none;
}
#zoomBarra>*{pointer-events:auto}
#zoomBarra .caixa{
  background:var(--branco); border:1px solid var(--linha); border-radius:8px; padding:4px 6px;
  display:flex; gap:4px; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,.07); font-size:12px;
}
#palco{position:relative;margin:0 auto}
#paginas{transform-origin:top left;position:absolute;top:0;left:0}
.folha{
  position:relative; width:210mm; height:297mm; background:#fff; overflow:hidden;
  box-shadow:0 3px 16px rgba(0,0,0,.22); margin:0 0 8mm;
}
.folha .timbrado{position:absolute;left:0;top:0;width:210mm;height:297mm;z-index:0;display:block}
.folha .numero{
  position:absolute; right:6mm; bottom:2.5mm; z-index:2; font:7pt Arial,sans-serif; color:#8a8078;
}
.conteudo{
  position:absolute; left:16.7mm; top:32.4mm; width:168mm; z-index:1;
  font:9pt/1.74 Arial,Helvetica,sans-serif; color:#000; text-align:justify;
}
.conteudo p{margin:0 0 10pt}
.conteudo h1{font:bold 12pt/1.72 Arial,Helvetica,sans-serif;text-align:center;margin:0 0 28pt}
.conteudo .clausula{margin:0 0 10pt}
.conteudo .assinaturas{display:flex;margin-top:40pt}
.conteudo .assinaturas .col{width:50%;text-align:center;font-size:11pt;line-height:1.15}
.conteudo .assinaturas .traco{white-space:nowrap}
.conteudo .assinaturas .nome{font-size:9pt;font-weight:bold;margin-top:9pt}
.conteudo .data-local{margin:0 0 10pt}
.conteudo .vazio{background:#ffe9a8;border-radius:2px;padding:0 2px;color:#7a5b00}
.conteudo .quebra{display:block;height:0;overflow:hidden;font-size:0;line-height:0}

/* ---------- edição livre / modelo ---------- */
#folhaEdicao{
  width:210mm; margin:0 auto; background:#fff; box-shadow:0 3px 16px rgba(0,0,0,.22);
  padding:32.4mm 25.4mm 26mm 16.7mm; min-height:150mm;
}
#folhaEdicao:focus{outline:2px solid var(--acento);outline-offset:2px}
.editando{font:9pt/1.74 Arial,Helvetica,sans-serif;color:#000;text-align:justify}
.editando p{margin:0 0 10pt}
.editando h1{font:bold 12pt/1.72 Arial,Helvetica,sans-serif;text-align:center;margin:0 0 28pt}
.editando .assinaturas{display:flex;margin-top:40pt}
.editando .assinaturas .col{width:50%;text-align:center;font-size:11pt;line-height:1.15}
.editando .assinaturas .nome{font-size:9pt;font-weight:bold;margin-top:9pt}
.editando .quebra{
  display:block; border-top:1px dashed #c9b9a6; margin:14pt 0; height:0; position:relative;
}
.ph{background:#e8f0fb;border-radius:3px;padding:0 1px;color:#1a4c8f;box-shadow:0 0 0 1px #cfe0f5}
.ph.ruim{background:#fde8e6;color:#a3271d;box-shadow:0 0 0 1px #f3c4bf}

#capaEditor{
  position:fixed; inset:0; z-index:60; background:var(--fundo); display:none; flex-direction:column;
}
#capaEditor.aberto{display:flex}
#editorBarra{
  display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--branco);
  border-bottom:1px solid var(--linha);flex-wrap:wrap
}
#editorCorpo{flex:1;display:flex;overflow:hidden}
#editorArea{flex:1;overflow:auto;padding:20px}
#editorCampos{
  width:250px;flex:0 0 auto;border-left:1px solid var(--linha);background:var(--branco);
  overflow:auto;padding:10px
}
#editorCampos h4{margin:12px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta-fraca)}
#editorCampos h4:first-child{margin-top:0}
.chip{
  display:block;width:100%;text-align:left;border:1px solid var(--linha);background:var(--branco);
  border-radius:6px;padding:4px 7px;margin-bottom:4px;font-size:12px
}
.chip:hover{background:var(--areia-fraca);border-color:var(--areia)}
.chip code{color:#1a4c8f;font-size:11px}

/* ---------- modais ---------- */
.modal{
  position:fixed;inset:0;z-index:70;background:rgba(30,26,22,.42);display:none;
  align-items:center;justify-content:center;padding:24px
}
.modal.aberto{display:flex}
.modal .caixa{
  background:var(--branco);border-radius:12px;width:min(760px,100%);max-height:88vh;display:flex;
  flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.3);overflow:hidden
}
.modal .cab{padding:14px 18px;border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:10px}
.modal .cab h3{margin:0;font-size:15px}
.modal .cab .espaco{flex:1}
.modal .miolo{padding:14px 18px;overflow:auto}
.modal .rodape{padding:12px 18px;border-top:1px solid var(--linha);display:flex;gap:8px;justify-content:flex-end}
.lista{border:1px solid var(--linha);border-radius:8px;overflow:hidden}
.lista .item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--linha)}
.lista .item:last-child{border-bottom:none}
.lista .item:hover{background:var(--areia-fraca)}
.lista .item.ativo{background:var(--areia-fraca);box-shadow:inset 3px 0 0 var(--acento)}
.lista .item .txt{flex:1;min-width:0}
.lista .item .txt b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lista .item .txt span{font-size:11.5px;color:var(--tinta-fraca)}
.vazio-lista{padding:22px;text-align:center;color:var(--tinta-fraca);font-size:13px}

#torrada{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:90;
  background:var(--tinta);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;
  opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;max-width:80vw
}
#torrada.ver{opacity:1;transform:translateX(-50%) translateY(0)}
#torrada.ruim{background:var(--erro)}

#faixaTexto{
  display:none;align-items:center;gap:10px;padding:7px 14px;background:#fff6e5;
  border-bottom:1px solid #f0dcb8;font-size:12.5px
}
#faixaTexto.ver{display:flex}
body.travado #painel .grade{opacity:.55}
body.travado #painel input:disabled,body.travado #painel textarea:disabled,
body.travado #painel select:disabled{background:#f6f4f2;cursor:not-allowed}

/* ---------- impressão ---------- */
@media print{
  @page{size:A4;margin:0}
  html,body{height:auto;overflow:visible;background:#fff}
  #barra,#painel,#puxador,#zoomBarra,#capaEditor,.modal,#torrada,#faixaTexto{display:none!important}
  #corpo{display:block;height:auto}
  #visor{overflow:visible;padding:0;background:#fff}
  #palco{width:auto!important;height:auto!important;margin:0}
  #paginas{position:static;transform:none!important}
  .folha{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .folha:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>
<header id="barra">
  <div class="marca">Gerador de Contratos<small id="marcaSub">D´ROMA FESTAS</small></div>
  <button class="btn" id="btNovo" title="Começar um contrato em branco">＋ Novo</button>
  <button class="btn" id="btAbrir" title="Contratos já salvos">📂 Contratos</button>
  <button class="btn" id="btTexto" title="Mudar o que está escrito no contrato">✏️ Editar texto</button>
  <div class="espaco"></div>
  <span id="estadoSalvo"></span>
  <button class="btn" id="btImprimir" title="Abrir a janela de impressão (Ctrl+P)">🖨️ Imprimir</button>
  <button class="btn primario" id="btPdf" title="Baixar o PDF já com o nome certo">⬇️ Baixar PDF</button>
  <button class="btn" id="btMenu" title="Mais opções">⋯</button>
</header>

<div id="faixaTexto">
  <span>⚠️ Este contrato tem <b>texto próprio</b>: o formulário está travado porque não muda mais o que está escrito. Para mexer nos dados, edite o texto ou volte ao modelo.</span>
  <button class="btn pequeno" id="btVoltarModelo">Voltar ao modelo</button>
  <button class="btn pequeno" id="btEditarProprio">Editar o texto</button>
</div>

<div id="corpo">
  <aside id="painel"></aside>
  <div id="puxador"></div>
  <section id="visor">
    <div id="zoomBarra">
      <div class="caixa">
        <button class="btn pequeno" id="btZoomMenos">−</button>
        <span id="zoomTxt" style="min-width:44px;text-align:center">100%</span>
        <button class="btn pequeno" id="btZoomMais">+</button>
        <button class="btn pequeno" id="btZoomAjustar">Ajustar</button>
        <span style="color:var(--tinta-fraca)">|</span>
        <span id="infoPaginas">1 página</span>
      </div>
    </div>
    <div id="palco"><div id="paginas"></div></div>
  </section>
</div>

<!-- editor de texto (contrato próprio ou modelo) -->
<div id="capaEditor">
  <div id="editorBarra">
    <b id="editorTitulo">Editar texto</b>
    <span style="color:var(--tinta-fraca)" id="editorSub"></span>
    <span style="width:10px"></span>
    <button class="btn pequeno" data-cmd="bold" title="Negrito (Ctrl+B)"><b>N</b></button>
    <button class="btn pequeno" data-cmd="italic" title="Itálico (Ctrl+I)"><i>I</i></button>
    <button class="btn pequeno" data-cmd="underline" title="Sublinhado (Ctrl+U)"><u>S</u></button>
    <button class="btn pequeno" data-cmd="removeFormat" title="Limpar formatação">✕ formato</button>
    <button class="btn pequeno" id="btQuebra" title="Forçar mudança de página aqui">⤶ Quebra de página</button>
    <div class="espaco" style="flex:1"></div>
    <button class="btn pequeno" id="btRestaurarModelo" title="Voltar ao texto original do contrato">↺ Restaurar padrão</button>
    <button class="btn" id="btCancelarEditor">Cancelar</button>
    <button class="btn primario" id="btSalvarEditor">Salvar</button>
  </div>
  <div id="editorCorpo">
    <div id="editorArea"><div id="folhaEdicao" class="editando" contenteditable="true" spellcheck="true"></div></div>
    <div id="editorCampos"></div>
  </div>
</div>

<!-- modal genérico -->
<div class="modal" id="modal">
  <div class="caixa">
    <div class="cab"><h3 id="modalTitulo"></h3><div class="espaco"></div>
      <button class="btn pequeno" id="modalFechar">✕</button></div>
    <div class="miolo" id="modalMiolo"></div>
    <div class="rodape" id="modalRodape"></div>
  </div>
</div>

/* ------------------------------------------------------------- extenso */
const UNI = ["","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze",
  "treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove"];
const DEZ = ["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
const CEN = ["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos",
  "oitocentos","novecentos"];

/* estado civil acompanha o campo Sexo (casada <-> casado, viúva <-> viúvo...) */
const CIVIL_FEM = ["solteira","casada","divorciada","viúva","separada","desquitada"];
const CIVIL_MAS = ["solteiro","casado","divorciado","viúvo","separado","desquitado"];
function flexionarCivil(txt, fem){
  const t = (txt || "").trim();
  if(!t) return "";
  const chave = t.toLowerCase();
  const iF = CIVIL_FEM.indexOf(chave), iM = CIVIL_MAS.indexOf(chave);
  if(iF < 0 && iM < 0) return t;              // "união estável" e afins ficam como estão
  return fem ? CIVIL_FEM[iF < 0 ? iM : iF] : CIVIL_MAS[iM < 0 ? iF : iM];
}

function ate999(n){
  if(n === 0) return "";
  if(n === 100) return "cem";
  const c = Math.floor(n/100), r = n%100, p = [];
  if(c) p.push(CEN[c]);
  if(r){
    if(r < 20) p.push(UNI[r]);
    else { const d = Math.floor(r/10), u = r%10; p.push(DEZ[d] + (u ? " e " + UNI[u] : "")); }
  }
  return p.join(" e ");
}
function juntaGrupos(partes){
  // liga com "e" só antes do último grupo, e só se ele for < 100 ou centena redonda
  let s = partes[0].txt;
  for(let i = 1; i < partes.length; i++){
    const ultimo = i === partes.length - 1, b = partes[i].bruto;
    s += (ultimo && (b < 100 || b % 100 === 0) ? " e " : " ") + partes[i].txt;
  }
  return s;
}
function extensoReais(valor){
  const cent = Math.round(Math.abs(Number(valor) || 0) * 100);
  const reais = Math.floor(cent/100), cs = cent%100;
  const trechos = [];
  if(reais >= 1e9) return "valor alto demais — escreva o extenso à mão";
  if(reais > 0){
    const mi = Math.floor(reais/1e6), mil = Math.floor((reais%1e6)/1000), un = reais%1000;
    const partes = [];
    if(mi)  partes.push({bruto: mi,  txt: ate999(mi) + (mi === 1 ? " milhão" : " milhões")});
    if(mil) partes.push({bruto: mil, txt: (mil === 1 ? "mil" : ate999(mil) + " mil")});
    if(un)  partes.push({bruto: un,  txt: ate999(un)});
    // "um milhão DE reais" quando não sobra nada depois do milhão
    const soMilhoes = mi > 0 && mil === 0 && un === 0;
    trechos.push(juntaGrupos(partes) +
      (soMilhoes ? " de reais" : (reais === 1 ? " real" : " reais")));
  }
  if(cs > 0) trechos.push(ate999(cs) + (cs === 1 ? " centavo" : " centavos"));
  if(!trechos.length) return "zero reais";
  return trechos.join(" e ");
}

/* --------------------------------------------------------- formatação */
function fmtDinheiro(v){
  const n = Number(v);
  if(!isFinite(n)) return "";
  return "R$ " + n.toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
}
function lerDinheiro(txt){
  const d = soDigitos(txt);
  return d ? Number(d)/100 : null;
}
function fmtCPF(v){
  const d = soDigitos(v).slice(0,11);
  return d.replace(/^(\d{3})(\d)/,"$1.$2").replace(/^(\d{3})\.(\d{3})(\d)/,"$1.$2.$3")
          .replace(/\.(\d{3})(\d)/,".$1-$2");
}
function cpfValido(v){
  const d = soDigitos(v);
  if(d.length !== 11 || /^(\d)\1{10}$/.test(d)) return false;
  let s = 0;
  for(let i=0;i<9;i++) s += +d[i]*(10-i);
  let r = (s*10)%11; if(r === 10) r = 0;
  if(r !== +d[9]) return false;
  s = 0;
  for(let i=0;i<10;i++) s += +d[i]*(11-i);
  r = (s*10)%11; if(r === 10) r = 0;
  return r === +d[10];
}
function fmtTelefone(v){
  const d = soDigitos(v).slice(0,11);
  if(d.length <= 2) return d.length ? "(" + d : "";
  if(d.length <= 6) return "(" + d.slice(0,2) + ") " + d.slice(2);
  if(d.length <= 10) return "(" + d.slice(0,2) + ") " + d.slice(2,6) + "-" + d.slice(6);
  return "(" + d.slice(0,2) + ") " + d.slice(2,7) + "-" + d.slice(7);
}
function fmtDataBR(iso){
  if(!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return "";
  const [a,m,d] = iso.split("-");
  return d + "/" + m + "/" + a;
}
function hojeISO(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function abreviarNome(nome){
  const p = String(nome || "").trim().split(/\s+/).filter(Boolean);
  if(p.length <= 2) return p.join(" ").toUpperCase();
  const ligas = ["de","da","do","das","dos","e"];
  const meio = p.slice(1, -1).map(w => ligas.includes(w.toLowerCase()) ? w.toUpperCase() : w[0].toUpperCase() + ".");
  return [p[0], ...meio, p[p.length-1]].join(" ").toUpperCase();
}

function placeholdersDe(html){
  const s = new Set(); let m;
  const re = /\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g;
  while((m = re.exec(html))) s.add(m[1]);
  return Array.from(s);
}
function resolver(c){
  const d = c.dados, v = {};
  GRUPOS.forEach(g => g.campos.forEach(cp => { v[cp.id] = (d[cp.id] || "").toString().trim(); }));
  Object.keys(d).forEach(k => { if(!(k in v)) v[k] = (d[k] || "").toString().trim(); });

  const fem = (v.sexo || "feminino") === "feminino";
  const femL = (v.locadora_sexo || "feminino") === "feminino";
  v.portador = fem ? "portadora" : "portador";
  v.domiciliado = fem ? "domiciliada" : "domiciliado";
  v.locadora_portador = femL ? "portadora" : "portador";
  v.locadora_domiciliado = femL ? "domiciliada" : "domiciliado";

  v.estado_civil = flexionarCivil(v.estado_civil, fem);
  v.locadora_estado_civil = flexionarCivil(v.locadora_estado_civil, femL);
  v.estado_civil_frase = v.estado_civil ? v.estado_civil + ", " : "";
  v.locadora_estado_civil_frase = v.locadora_estado_civil ? v.locadora_estado_civil + ", " : "";
  v.profissao_frase = v.profissao ? v.profissao + ", " : "";
  v.rg_frase = v.rg ? "RG: " + v.rg + ", " : "";

  v.endereco = [v.rua, v.numero, v.complemento].filter(Boolean).join(", ");

  const tot = lerDinheiro(d.valor_total), ent = lerDinheiro(d.entrada);
  const sal = (tot != null) ? Math.max(0, tot - (ent || 0)) : null;
  v.valor_total = tot != null ? fmtDinheiro(tot) : "";
  v.entrada = ent != null ? fmtDinheiro(ent) : "";
  v.saldo = sal != null ? fmtDinheiro(sal) : "";
  v.valor_total_extenso = tot != null ? extensoReais(tot).toUpperCase() : "";
  v.entrada_extenso = ent != null ? extensoReais(ent).toUpperCase() : "";
  v.saldo_extenso = sal != null ? extensoReais(sal).toUpperCase() : "";

  v.data_evento = fmtDataBR(d.data_evento);
  v.data_contrato = fmtDataBR(d.data_contrato);
  v.cpf = fmtCPF(d.cpf);
  v.locadora_cpf = fmtCPF(d.locadora_cpf);
  v.telefone = fmtTelefone(d.telefone);
  v.nome_assinatura = (d.nome_assinatura || "").trim() || (d.nome || "").trim().toUpperCase();
  return v;
}
/* campos que podem ficar vazios sem virar aviso amarelo */
const PODE_VAZIO = ["estado_civil_frase","locadora_estado_civil_frase","profissao_frase",
  "rg_frase","complemento","estado_civil","locadora_estado_civil","profissao","rg"];

function montarHTML(c){
  if(c.htmlProprio) return c.htmlProprio;
  const v = resolver(c);
  return modeloDe(c).html.replace(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g, (m, k) => {
    const val = v[k];
    if((val === undefined || val === "") && PODE_VAZIO.includes(k)) return "";
    if(val === undefined || val === "") {
      const rot = (DEF_CAMPO[k] && DEF_CAMPO[k].rot) || k.replace(/_/g," ");
      return '<span class="vazio">«' + esc(rot) + "»</span>";
    }
    return esc(val);
  });
}

function atomos(el){
  const out = [];
  (function anda(no, pilha){
    no.childNodes.forEach(f => {
      if(f.nodeType === 3){
        (f.nodeValue.match(/\S+/g) || []).forEach(p => out.push({p, pilha}));
      }else if(f.nodeType === 1){
        if(f.tagName === "BR") out.push({br:true, pilha});
        else anda(f, pilha.concat([f]));
      }
    });
  })(el, []);
  return out;
}
function montarDe(molde, lista){
  const novo = molde.cloneNode(false);
  let chaveAtual = null, alvo = novo, primeiro = true;
  lista.forEach(a => {
    const chave = a.pilha.map(e => e.tagName + "|" + e.className + "|" + (e.getAttribute("style")||"")).join(">");
    if(chave !== chaveAtual){
      chaveAtual = chave; alvo = novo;
      a.pilha.forEach(p => { const cl = p.cloneNode(false); alvo.appendChild(cl); alvo = cl; });
    }
    if(a.br){ alvo.appendChild(document.createElement("br")); primeiro = true; return; }
    alvo.appendChild(document.createTextNode((primeiro ? "" : " ") + a.p));
    primeiro = false;
  });
  return novo;
}
function transbordou(area){
  const u = area.lastElementChild;
  if(!u) return false;
  return u.offsetTop + u.offsetHeight > LIMITE_PX + 0.5;
}
function dividir(area, bloco){
  if(bloco.classList && bloco.classList.contains("nao-quebrar")) return null;
  const molde = bloco.cloneNode(false);
  const todos = atomos(bloco);
  if(todos.length < 2) return null;
  const topo = bloco.offsetTop;
  let lo = 1, hi = todos.length - 1, melhor = 0, atual = bloco;
  while(lo <= hi){
    const meio = (lo + hi) >> 1;
    const teste = montarDe(molde, todos.slice(0, meio));
    area.replaceChild(teste, atual); atual = teste;
    if(topo + atual.offsetHeight <= LIMITE_PX + 0.5){ melhor = meio; lo = meio + 1; }
    else hi = meio - 1;
  }
  if(melhor === 0){ area.replaceChild(montarDe(molde, todos), atual); return null; }
  area.replaceChild(montarDe(molde, todos.slice(0, melhor)), atual);
  return montarDe(molde, todos.slice(melhor));
}
function novaFolha(cont){
  const f = document.createElement("div");
  f.className = "folha";
  const img = document.createElement("img");
  img.className = "timbrado"; img.src = timbradoAtual(); img.alt = "";
  const ct = document.createElement("div");
  ct.className = "conteudo";
  f.appendChild(img); f.appendChild(ct); cont.appendChild(f);
  return ct;
}
function timbradoAtual(){
  return (D.config && D.config.timbrado) || $("#timbradoFonte").src;
}
function paginar(html){
  const cont = $("#paginas");
  cont.innerHTML = "";
  const molde = document.createElement("div");
  molde.innerHTML = html;
  // texto solto na raiz (o editor livre produz isso) vira parágrafo em vez de sumir
  Array.from(molde.childNodes).forEach(n => {
    if(n.nodeType === 3 && n.nodeValue.trim()){
      const p = document.createElement("p");
      p.textContent = n.nodeValue;
      molde.replaceChild(p, n);
    }
  });
  const fila = Array.from(molde.children);
  let area = novaFolha(cont);
  let guarda = 0;
  while(fila.length && guarda++ < 4000){
    const b = fila.shift();
    if(b.classList && b.classList.contains("quebra")){
      if(area.children.length) area = novaFolha(cont);
      continue;
    }
    area.appendChild(b);
    if(!transbordou(area)) continue;
    if(area.children.length > 1){
      area.removeChild(b); fila.unshift(b); area = novaFolha(cont); continue;
    }
    const resto = dividir(area, b);
    if(resto) fila.unshift(resto);
  }
  // quebra de página no fim do texto deixaria uma folha em branco
  while(cont.children.length > 1 && !cont.lastElementChild.querySelector(".conteudo").children.length)
    cont.removeChild(cont.lastElementChild);
  if(D.config.numerarPaginas){
    const folhas = Array.from(cont.children);
    folhas.forEach((f, i) => {
      const n = document.createElement("div");
      n.className = "numero"; n.textContent = (i+1) + " / " + folhas.length;
      f.appendChild(n);
    });
  }
  return cont.children.length;
}

/* ----------------------------------------------------------- render */
let zoom = 1, zoomAuto = true;
function aplicarZoom(){
  const paginas = $("#paginas"), palco = $("#palco");
  const larg = 210 * MM;
  if(zoomAuto){
    const disp = $("#visor").clientWidth - 48;
    zoom = Math.min(1.6, Math.max(0.25, disp / larg));
  }
  paginas.style.transform = "scale(" + zoom + ")";
  palco.style.width = (larg * zoom) + "px";
  palco.style.height = (paginas.offsetHeight * zoom) + "px";
  $("#zoomTxt").textContent = Math.round(zoom*100) + "%";
}
let renderTimer = null;
function renderizar(agora){
  clearTimeout(renderTimer);
  const faz = () => {
    const c = contratoAtual();
    const n = paginar(montarHTML(c));
    $("#infoPaginas").textContent = n + (n === 1 ? " página" : " páginas");
    $("#faixaTexto").className = c.htmlProprio ? "ver" : "";
    $("#marcaSub").textContent = c.dados.salao_nome || "Contrato";
    document.title = nomeArquivo(c);
    aplicarZoom();
    atualizarPendencias();
  };
  if(agora) faz(); else renderTimer = setTimeout(faz, 110);
}
function nomeArquivo(c){
  if(c.nomeArquivo) return c.nomeArquivo;
  const d = c.dados;
  const completo = D.config.nomeArquivoCompleto;
  const nome = (d.nome || "").trim().toUpperCase();
  const usar = !nome ? "SEM NOME" : (completo ? nome : nome.split(/\s+/)[0]);
  const data = (d.data_evento && /^\d{4}-\d{2}-\d{2}$/.test(d.data_evento))
    ? d.data_evento.split("-").reverse().join("_") : "SEM_DATA";
  return (D.config.padraoArquivo || "CONTRATO {NOME} {DATA}")
    .replace(/\{NOME\}/g, usar).replace(/\{DATA\}/g, data)
    .replace(/[\\/:*?"<>|]/g, "-").replace(/\s+/g," ").trim();
}
</script>

<script>
"use strict";
/* =======================================================================
   Gerador de PDF — lê o que está desenhado na tela (as folhas do preview)
   e escreve um PDF de verdade, com texto selecionável. Sem biblioteca.
   ======================================================================= */

/* CP1252: só os códigos de 0x80–0x9F que não batem com Unicode */
const WIN1252 = {0x20AC:0x80,0x201A:0x82,0x0192:0x83,0x201E:0x84,0x2026:0x85,0x2020:0x86,
  0x2021:0x87,0x02C6:0x88,0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,0x017D:0x8E,
  0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,0x2014:0x97,
  0x02DC:0x98,0x2122:0x99,0x0161:0x9A,0x203A:0x9B,0x0153:0x9C,0x017E:0x9E,0x0178:0x9F};

function bytesLatin1(s){
  const b = new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) b[i] = s.charCodeAt(i) & 0xff;
  return b;
}
function b64Bytes(b64){
  const bin = atob(b64), b = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) b[i] = bin.charCodeAt(i);
  return b;
}
function textoPDF(s){
  let out = "";
  for(const ch of String(s)){
    let cod = ch.codePointAt(0);
    if(cod > 0xFF) cod = WIN1252[cod] !== undefined ? WIN1252[cod] : 0x3F;
    if(cod === 0x28 || cod === 0x29 || cod === 0x5C) out += "\\" + String.fromCharCode(cod);
    else if(cod < 32 || cod > 126) out += "\\" + cod.toString(8).padStart(3,"0");
    else out += String.fromCharCode(cod);
  }
  return out;
}
const n3 = v => (Math.round(v*1000)/1000).toString();

/* --------------------------------------------- métricas da fonte (Arial) */
const _mcache = {};
function razoes(negrito, italico){
  const k = (negrito?"b":"") + (italico?"i":"");
  if(_mcache[k]) return _mcache[k];
  const cx = razoes._cx || (razoes._cx = document.createElement("canvas").getContext("2d"));
  cx.font = (italico?"italic ":"") + (negrito?"bold ":"") + "100px Arial";
  const m = cx.measureText("Hxjgq");
  let asc = m.fontBoundingBoxAscent, desc = m.fontBoundingBoxDescent;
  if(!isFinite(asc) || !asc){ asc = 90.5; desc = 21.2; }
  return (_mcache[k] = {asc: asc/100, desc: desc/100});
}
function corRGB(txt){
  const m = String(txt||"").match(/rgba?\(([^)]+)\)/);
  if(!m) return null;
  const p = m[1].split(",").map(x => parseFloat(x));
  return {r:p[0]/255, g:p[1]/255, b:p[2]/255, a: p.length > 3 ? p[3] : 1};
}

/* ------------------------------------ lê uma folha e devolve os desenhos */
function lerFolha(folha){
  const r0 = folha.getBoundingClientRect();
  const escala = r0.width / (210 * MM) || 1;   // 210 mm é a largura real da folha
  const px = v => v / escala * PT;
  const X = v => (v - r0.left) / escala * PT;
  const Y = v => (v - r0.top)  / escala * PT;
  const itens = [];

  const cam = document.createTreeWalker(folha, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
  let no = folha;
  do{
    if(no.nodeType === 1){
      const cs = getComputedStyle(no);
      if(cs.display === "none" || cs.visibility === "hidden" || parseFloat(cs.opacity) === 0){
        // pula a subárvore inteira
        let prox = no.nextSibling, sobe = no;
        while(!prox && sobe.parentNode && sobe !== folha){ sobe = sobe.parentNode; prox = sobe.nextSibling; }
        if(!prox || !folha.contains(prox)) break;
        cam.currentNode = prox; no = prox; continue;
      }
      const r = no.getBoundingClientRect();
      const bg = corRGB(cs.backgroundColor);
      if(bg && bg.a > 0.02 && r.width > 0 && r.height > 0)
        itens.push({t:"ret", x:X(r.left), y:Y(r.top), w:px(r.width), h:px(r.height), cor:bg});
      [["Top",0],["Right",1],["Bottom",2],["Left",3]].forEach(([lado, i]) => {
        const larg = parseFloat(cs["border" + lado + "Width"]) || 0;
        if(larg <= 0 || cs["border" + lado + "Style"] === "none") return;
        const c = corRGB(cs["border" + lado + "Color"]);
        if(!c || c.a < 0.02) return;
        const L = px(larg);
        const cx = {0:{x:X(r.left), y:Y(r.top), w:px(r.width), h:L},
                    1:{x:X(r.right)-L, y:Y(r.top), w:L, h:px(r.height)},
                    2:{x:X(r.left), y:Y(r.bottom)-L, w:px(r.width), h:L},
                    3:{x:X(r.left), y:Y(r.top), w:L, h:px(r.height)}}[i];
        itens.push({t:"ret", cor:c, ...cx});
      });
      if(no.tagName === "IMG" && no.complete && no.naturalWidth)
        itens.push({t:"img", el:no, x:X(r.left), y:Y(r.top), w:px(r.width), h:px(r.height)});
    }else if(no.nodeType === 3 && /\S/.test(no.nodeValue)){
      const pai = no.parentElement;
      const cs = getComputedStyle(pai);
      const fsPx = parseFloat(cs.fontSize);
      const peso = parseInt(cs.fontWeight, 10);
      const negrito = (isNaN(peso) ? cs.fontWeight === "bold" : peso >= 600);
      const italico = cs.fontStyle === "italic" || cs.fontStyle === "oblique";
      const cor = corRGB(cs.color) || {r:0,g:0,b:0,a:1};
      const sub = /underline/.test(cs.textDecorationLine || cs.textDecoration || "");
      const raz = razoes(negrito, italico);
      const re = /\S+/g; let m;
      while((m = re.exec(no.nodeValue))){
        const rg = document.createRange();
        rg.setStart(no, m.index); rg.setEnd(no, m.index + m[0].length);
        const r = rg.getBoundingClientRect();
        if(!r.width || !r.height) continue;
        const fs = fsPx * PT, alt = px(r.height);
        const base = Y(r.top) + (alt - (raz.asc + raz.desc) * fs) / 2 + raz.asc * fs;
        itens.push({t:"txt", s:m[0], x:X(r.left), base, fs, negrito, italico, cor,
                    sub, larg: px(r.width)});
      }
    }
    no = cam.nextNode();
  }while(no);
  return itens;
}

/* -------------------------------------------------- imagens para o PDF */
function imagemBytes(img){
  const src = img.currentSrc || img.src;
  const mj = /^data:image\/jpe?g;base64,(.+)$/i.exec(src);
  if(mj) return {bytes: b64Bytes(mj[1]), w: img.naturalWidth, h: img.naturalHeight};
  const cv = document.createElement("canvas");
  cv.width = img.naturalWidth; cv.height = img.naturalHeight;
  const cx = cv.getContext("2d");
  cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height);
  cx.drawImage(img, 0, 0);
  const url = cv.toDataURL("image/jpeg", 0.94);
  return {bytes: b64Bytes(url.split(",")[1]), w: cv.width, h: cv.height};
}

/* ------------------------------------------------------ monta o arquivo */
function gerarPDF(){
  const folhas = Array.from($("#paginas").children);
  if(!folhas.length) return null;
  const W = 595.276, H = 841.89;

  const objs = [];
  const novo = c => { objs.push(c); return objs.length; };
  const reservar = () => { objs.push(null); return objs.length; };

  const idCat = reservar(), idPgs = reservar();
  const fontes = {
    F1: novo("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>"),
    F2: novo("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"),
    F3: novo("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>"),
    F4: novo("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-BoldOblique /Encoding /WinAnsiEncoding >>")
  };
  const recFontes = Object.keys(fontes).map(k => "/" + k + " " + fontes[k] + " 0 R").join(" ");

  const cacheImg = new Map();
  function refImagem(el){
    const chave = el.currentSrc || el.src;
    if(cacheImg.has(chave)) return cacheImg.get(chave);
    const im = imagemBytes(el);
    const id = novo(["<< /Type /XObject /Subtype /Image /Width " + im.w + " /Height " + im.h +
      " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + im.bytes.length +
      " >>\nstream\n", im.bytes, "\nendstream"]);
    const r = {id, nome: "Im" + cacheImg.size};
    cacheImg.set(chave, r);
    return r;
  }

  const idsPagina = [];
  folhas.forEach(folha => {
    const itens = lerFolha(folha);
    const usadas = new Map();
    let s = "";
    let corAtual = null;
    const setCor = c => {
      const k = n3(c.r) + " " + n3(c.g) + " " + n3(c.b);
      if(k !== corAtual){ s += k + " rg\n"; corAtual = k; }
    };
    itens.forEach(it => {
      if(it.t === "ret"){
        setCor(it.cor);
        s += n3(it.x) + " " + n3(H - it.y - it.h) + " " + n3(it.w) + " " + n3(it.h) + " re f\n";
      }else if(it.t === "img"){
        const r = refImagem(it.el);
        usadas.set(r.nome, r.id);
        s += "q " + n3(it.w) + " 0 0 " + n3(it.h) + " " + n3(it.x) + " " +
             n3(H - it.y - it.h) + " cm /" + r.nome + " Do Q\n";
      }else{
        const f = it.negrito ? (it.italico ? "F4" : "F2") : (it.italico ? "F3" : "F1");
        setCor(it.cor);
        s += "BT /" + f + " " + n3(it.fs) + " Tf 1 0 0 1 " + n3(it.x) + " " +
             n3(H - it.base) + " Tm (" + textoPDF(it.s) + ") Tj ET\n";
        if(it.sub){
          const esp = Math.max(0.4, it.fs * 0.06);
          s += n3(it.x) + " " + n3(H - it.base - it.fs * 0.13) + " " + n3(it.larg) + " " +
               n3(esp) + " re f\n";
        }
      }
    });
    const idCont = novo(["<< /Length " + bytesLatin1(s).length + " >>\nstream\n", s, "\nendstream"]);
    const rec = "<< /Font << " + recFontes + " >>" +
      (usadas.size ? " /XObject << " + Array.from(usadas, ([n, i]) => "/" + n + " " + i + " 0 R").join(" ") + " >>" : "") +
      " >>";
    idsPagina.push(novo("<< /Type /Page /Parent " + idPgs + " 0 R /MediaBox [0 0 " + n3(W) + " " + n3(H) +
      "] /Resources " + rec + " /Contents " + idCont + " 0 R >>"));
  });

  objs[idCat-1] = "<< /Type /Catalog /Pages " + idPgs + " 0 R >>";
  objs[idPgs-1] = "<< /Type /Pages /Kids [" + idsPagina.map(i => i + " 0 R").join(" ") +
                  "] /Count " + idsPagina.length + " >>";

  const pedacos = []; let pos = 0;
  const w = x => { const b = (typeof x === "string") ? bytesLatin1(x) : x; pedacos.push(b); pos += b.length; };
  w("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  const offs = [];
  objs.forEach((o, i) => {
    offs[i] = pos;
    w((i+1) + " 0 obj\n");
    (Array.isArray(o) ? o : [o]).forEach(w);
    w("\nendobj\n");
  });
  const xref = pos;
  w("xref\n0 " + (objs.length+1) + "\n0000000000 65535 f \n");
  objs.forEach((_, i) => w(String(offs[i]).padStart(10,"0") + " 00000 n \n"));
  w("trailer\n<< /Size " + (objs.length+1) + " /Root " + idCat + " 0 R >>\nstartxref\n" + xref + "\n%%EOF\n");
  return new Blob(pedacos, {type:"application/pdf"});
}

function baixarPDF(){
  const c = contratoAtual();
  const faltam = $$("#paginas .vazio").length;
  if(faltam && !confirm("Faltam " + faltam + " campo(s) para preencher — eles vão sair marcados em amarelo no PDF.\n\nGerar mesmo assim?"))
    return;
  let blob;
  try{ blob = gerarPDF(); }
  catch(e){ console.error(e); torrada("Não consegui gerar o PDF: " + e.message, true); return; }
  if(!blob){ torrada("Nada para gerar.", true); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nomeArquivo(c) + ".pdf";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  torrada("PDF gerado: " + a.download);
}
</script>

<script>
"use strict";
/* =======================================================================
   Formulário, editor de texto, modais e ligações da interface
   ======================================================================= */

const DERIVADOS = ["portador","domiciliado","locadora_portador","locadora_domiciliado",
  "estado_civil_frase","locadora_estado_civil_frase","profissao_frase","rg_frase","endereco",
  "valor_total_extenso","entrada_extenso","saldo_extenso"];

/* ------------------------------------------------------- formulário */
function campoHTML(cp, valor, extra){
  const req = cp.req ? ' <span class="obrig" title="obrigatório">•</span>' : "";
  const cls = "campo " + (cp.cls || "c12");
  let ctrl;
  const at = 'data-id="' + cp.id + '"' + (cp.maiusc ? ' style="text-transform:uppercase"' : "");
  if(cp.tipo === "area")
    ctrl = '<textarea ' + at + '>' + esc(valor) + "</textarea>";
  else if(cp.tipo === "opcao")
    ctrl = "<select " + at + ">" + cp.opcoes.map(o =>
      '<option value="' + esc(o) + '"' + (o === valor ? " selected" : "") + ">" + esc(o) + "</option>").join("") + "</select>";
  else{
    const tipo = cp.tipo === "data" ? "date" : cp.tipo === "hora" ? "time" : "text";
    const modo = cp.tipo === "numero" ? ' inputmode="numeric"' :
                 cp.tipo === "dinheiro" ? ' inputmode="decimal"' :
                 cp.tipo === "cpf" || cp.tipo === "telefone" ? ' inputmode="numeric"' : "";
    ctrl = "<input type=\"" + tipo + "\" " + at + modo +
      (cp.auto && cp.id !== "data_contrato" ? ' data-auto="1"' : "") +
      ' value="' + esc(valor) + '">';
  }
  return '<div class="' + cls + '" data-campo="' + cp.id + '">' +
    "<label>" + esc(cp.rot) + req + "</label>" + ctrl +
    (cp.dica ? '<div class="dica">' + esc(cp.dica) + "</div>" : '<div class="dica"></div>') + "</div>";
}
function montarFormulario(){
  const c = contratoAtual();
  const usados = placeholdersDe(modeloDe(c).html);
  let h = "";

  h += '<div class="secao" style="padding:10px 14px;display:flex;gap:8px;align-items:center">' +
       '<label style="font-size:11.5px;color:var(--tinta-fraca)">Modelo</label>' +
       '<select id="selModelo" style="flex:1;border:1px solid var(--linha);border-radius:6px;padding:6px 8px">' +
       D.modelos.map(m => '<option value="' + m.id + '"' + (m.id === c.modeloId ? " selected" : "") + ">" +
         esc(m.nome) + "</option>").join("") +
       '</select><button class="btn pequeno" id="btModelos">gerenciar</button></div>';

  GRUPOS.forEach(g => {
    const campos = g.campos;
    h += '<details class="secao"' + (g.fechado ? "" : " open") + ' data-grupo="' + g.id + '">' +
      "<summary>" + esc(g.titulo) + '<span class="conta"></span></summary><div class="grade">' +
      campos.map(cp => campoHTML(cp, c.dados[cp.id] || "")).join("");
    if(g.id === "locadora")
      h += '<div class="linha-btns"><button class="btn pequeno" id="btLocadoraPadrao">Usar estes dados como padrão nos próximos contratos</button></div>';
    if(g.id === "valores")
      h += '<div class="aviso">Digite os valores <b>com os centavos</b>: teclar <code>70000</code> vira ' +
           "<b>R$ 700,00</b>. O saldo e os valores por extenso saem sozinhos.</div>";
    h += "</div></details>";
  });

  const extras = usados.filter(k => !DEF_CAMPO[k] && !DERIVADOS.includes(k));
  if(extras.length){
    h += '<details class="secao" open data-grupo="extras"><summary>Campos extras do modelo' +
      '<span class="conta"></span></summary><div class="grade">' +
      extras.map(k => campoHTML({id:k, rot:k.replace(/_/g," "), tipo:"texto", cls:"c12"}, c.dados[k] || "")).join("") +

  };
  $("#btNomeArquivo").onclick = () => {

    if(v === null) return;

function aoDigitar(e){
  const el = e.target;
  const id = el.dataset && el.dataset.id;
  if(!id) return;
  const cp = DEF_CAMPO[id] || {tipo:"texto"};
  let v = el.value;
  if(cp.tipo === "cpf" || cp.tipo === "telefone"){
    const bruto = el.value, pos = el.selectionStart;
    v = cp.tipo === "cpf" ? fmtCPF(bruto) : fmtTelefone(bruto);
    el.value = v;
    // devolve o cursor para onde ele estava, contando por dígito e não por caractere
    if(document.activeElement === el){
      const alvo = soDigitos(bruto.slice(0, pos)).length;
      let i = 0, achou = 0;
      while(i < v.length && achou < alvo){ if(/\d/.test(v[i])) achou++; i++; }
      try{ el.setSelectionRange(i, i); }catch(err){}
    }
  }
  if(cp.tipo === "dinheiro"){ const n = lerDinheiro(v); v = n === null ? "" : fmtDinheiro(n); el.value = v; }
  if(cp.tipo === "numero"){ v = soDigitos(v); el.value = v; }
  if(cp.maiusc) v = v.toUpperCase();

  const c = contratoAtual();
  c.dados[id] = v;
  c.alterado = Date.now();

  if(id === "sexo"){
    const outro = v === "feminino" ? "brasileiro" : "brasileira";
    if((c.dados.nacionalidade || "").toLowerCase() === outro)
      c.dados.nacionalidade = v === "feminino" ? "brasileira" : "brasileiro";
    const cn = $('[data-id="nacionalidade"]'); if(cn) cn.value = c.dados.nacionalidade;
  }
  if(id === "locadora_sexo"){
    const outro = v === "feminino" ? "brasileiro" : "brasileira";
    if((c.dados.locadora_nacionalidade || "").toLowerCase() === outro){
      c.dados.locadora_nacionalidade = v === "feminino" ? "brasileira" : "brasileiro";
      const cn = $('[data-id="locadora_nacionalidade"]'); if(cn) cn.value = c.dados.locadora_nacionalidade;
    }
  }
  salvar();
  renderizar();
}
function atualizarPendencias(){
  const c = contratoAtual();
  const v = resolver(c);
  // com texto próprio o formulário não manda mais no contrato: trava para não enganar
  const travado = !!c.htmlProprio;
  document.body.classList.toggle("travado", travado);
  $$("#painel input, #painel textarea, #painel select").forEach(el => {
    if(el.id === "selModelo") return;
    el.disabled = travado || el.dataset.id === "saldo";
  });
  const sal = $('[data-id="saldo"]');
  if(sal){ sal.value = v.saldo; sal.style.background = "var(--areia-fraca)"; }
  const na = $('[data-id="nome_assinatura"]');
  if(na) na.placeholder = (c.dados.nome || "").trim().toUpperCase() ||
    "(usa o nome completo) — ex: " + abreviarNome("Maria de Souza Lima");

  const cpfEl = $('[data-id="cpf"]');
  if(cpfEl){
    const d = cpfEl.closest(".campo").querySelector(".dica");
    const t = c.dados.cpf || "";
    d.className = "dica" + (t ? (cpfValido(t) ? " bom" : " ruim") : "");
    d.textContent = t ? (cpfValido(t) ? "CPF válido" : "CPF não confere — confira os números") : "";
  }
  const usados = placeholdersDe(modeloDe(c).html);
  GRUPOS.forEach(g => {
    const sec = $('[data-grupo="' + g.id + '"]');
    if(!sec) return;
    let n = 0;
    g.campos.forEach(cp => {
      const cx = sec.querySelector('[data-campo="' + cp.id + '"]');
      if(!cx) return;
      const vazio = cp.req && !(c.dados[cp.id] || "").toString().trim() && usados.includes(cp.id);
      cx.classList.toggle("faltando", !!vazio);
      if(vazio) n++;
    });
    sec.querySelector(".conta").textContent = n ? n : "";
  });
  const pn = $("#previaNome");
  if(pn) pn.textContent = nomeArquivo(c) + ".pdf";
}

/* -------------------------------------------------------- editor */
let editorAlvo = null;
function conhecido(k){ return !!DEF_CAMPO[k] || DERIVADOS.includes(k); }
function decorar(html){
  return html.replace(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g, (m, k) =>
    '<span class="ph' + (conhecido(k) ? "" : " ruim") + '">{{' + k + "}}</span>");
}
function desdecorar(raiz){
  raiz.querySelectorAll("span.ph").forEach(s => s.replaceWith(document.createTextNode(s.textContent)));
  return raiz.innerHTML;
}
function abrirEditor(alvo){
  const c = contratoAtual();
  if(alvo === "proprio" && !c.htmlProprio){
    const faltam = $$("#paginas .vazio").length;
    if(faltam && !confirm("Ainda faltam " + faltam + " campo(s) do formulário.\n\n" +
      "Se você editar o texto agora, os avisos amarelos viram texto de verdade dentro do contrato " +
      "e o formulário para de preencher sozinho.\n\nQuer editar assim mesmo?")) return;
  }
  editorAlvo = alvo;
  const ed = $("#folhaEdicao");
  if(alvo === "modelo"){
    $("#editorTitulo").textContent = "Editando o modelo: " + modeloDe(c).nome;
    $("#editorSub").textContent = "vale para todos os contratos que usam este modelo";
    ed.innerHTML = decorar(modeloDe(c).html);
    $("#editorCampos").style.display = "";
  }else{
    $("#editorTitulo").textContent = "Editando o texto deste contrato";
    $("#editorSub").textContent = "só este contrato muda; o modelo continua igual";
    ed.innerHTML = c.htmlProprio || montarHTML(c);
    ed.querySelectorAll(".vazio").forEach(s => s.replaceWith(document.createTextNode(s.textContent)));
    $("#editorCampos").style.display = "none";
  }
  montarPainelCampos();
  $("#capaEditor").classList.add("aberto");
  ed.focus();
}
function fecharEditor(){ $("#capaEditor").classList.remove("aberto"); editorAlvo = null; }
function salvarEditor(){
  const c = contratoAtual();
  const clone = $("#folhaEdicao").cloneNode(true);
  if(editorAlvo === "modelo"){
    modeloDe(c).html = desdecorar(clone);
    torrada("Modelo salvo.");
  }else{
    c.htmlProprio = clone.innerHTML;
    torrada("Texto deste contrato salvo.");
  }
  c.alterado = Date.now();
  salvar(true); fecharEditor(); montarFormulario(); renderizar(true);
}
function montarPainelCampos(){
  let h = "";
  GRUPOS.forEach(g => {
    h += "<h4>" + esc(g.titulo) + "</h4>";
    g.campos.forEach(cp => {
      h += '<button class="chip" data-ph="' + cp.id + '" onmousedown="return false">' +
        esc(cp.rot) + "<br><code>{{" + cp.id + "}}</code></button>";
    });
  });
  h += "<h4>Automáticos</h4>";
  [["endereco","Endereço montado"],["saldo","Saldo"],["valor_total_extenso","Valor por extenso"],
   ["entrada_extenso","Entrada por extenso"],["saldo_extenso","Saldo por extenso"],
   ["portador","portador / portadora"],["domiciliado","domiciliado / domiciliada"],
   ["estado_civil_frase","Estado civil + vírgula"],["profissao_frase","Profissão + vírgula"],
   ["rg_frase","RG + vírgula"]].forEach(([k, r]) => {
    h += '<button class="chip" data-ph="' + k + '" onmousedown="return false">' +
      esc(r) + "<br><code>{{" + k + "}}</code></button>";
  });
  h += '<h4>Novo campo</h4><button class="chip" id="chipNovo" onmousedown="return false">' +
       "➕ criar um campo novo<br><code>vira uma caixa no formulário</code></button>";
  $("#editorCampos").innerHTML = h;
  $("#editorCampos").onclick = e => {
    const b = e.target.closest(".chip");
    if(!b) return;
    let k = b.dataset.ph;
    if(b.id === "chipNovo"){
      const nome = prompt("Nome do campo novo (sem espaço, ex: cor_do_tema):");
      if(!nome) return;
      k = nome.trim().toLowerCase().normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9_]+/g, "_")
            .replace(/^_+|_+$/g, "");
      if(!k) return;
    }
    $("#folhaEdicao").focus();
    document.execCommand("insertHTML", false, decorar("{{" + k + "}}"));
  };
}

function telaContratos(){
  const itens = D.contratos.slice().sort((a,b) => b.alterado - a.alterado);
  const linha = c => {
    const d = c.dados;
    const quando = d.data_evento ? fmtDataBR(d.data_evento) : "sem data";
    return '<div class="item' + (c.id === D.atual ? " ativo" : "") + '" data-id="' + c.id + '">' +
      '<div class="txt"><b>' + esc(d.nome || "(sem nome)") + "</b><span>" + esc(quando) + " · " +
      esc(d.tipo_festa || "") + " · " + esc(d.valor_total || "") + "</span></div>" +
      '<button class="btn pequeno" data-acao="abrir">abrir</button>' +
      '<button class="btn pequeno" data-acao="copiar">duplicar</button>' +
      '<button class="btn pequeno perigo" data-acao="apagar">apagar</button></div>';
  };
  const html = '<input id="buscaContrato" placeholder="Buscar por nome..." ' +
    'style="width:100%;padding:8px;border:1px solid var(--linha);border-radius:7px;margin-bottom:10px">' +
    '<div class="lista" id="listaContratos">' +
    (itens.length ? itens.map(linha).join("") : '<div class="vazio-lista">Nenhum contrato salvo ainda.</div>') +
    "</div>";
  abrirModal("Contratos salvos (" + itens.length + ")", html,
    [{texto:"Novo contrato", cls:"primario", acao:() => novoContrato()}, {texto:"Fechar"}]);
  $("#buscaContrato").oninput = e => {
    const q = e.target.value.toLowerCase();
    $$("#listaContratos .item").forEach(it => {
      it.style.display = it.querySelector("b").textContent.toLowerCase().includes(q) ? "" : "none";
    });
  };
  $("#listaContratos").onclick = e => {
    const it = e.target.closest(".item"); if(!it) return;
    const c = D.contratos.find(x => x.id === it.dataset.id); if(!c) return;
    const acao = e.target.dataset.acao || "abrir";
    if(acao === "abrir"){
      D.atual = c.id; salvar(); montarFormulario(); renderizar(true); fecharModal();
    }else if(acao === "copiar"){
      const n = JSON.parse(JSON.stringify(c));
      n.id = idNovo(); n.criado = n.alterado = Date.now(); n.nomeArquivo = null;
      D.contratos.unshift(n); D.atual = n.id; salvar();
      montarFormulario(); renderizar(true); fecharModal(); torrada("Contrato duplicado.");
    }else if(acao === "apagar"){
      if(!confirm("Apagar o contrato de " + (c.dados.nome || "sem nome") + "? Não dá pra desfazer.")) return;
      D.contratos = D.contratos.filter(x => x.id !== c.id);
      if(D.atual === c.id) D.atual = D.contratos[0] ? D.contratos[0].id : null;
      salvar(true);
      if(!D.contratos.length) novoContrato();
      montarFormulario(); renderizar(true); telaContratos();
    }
  };
}
function telaModelos(){
  const c = contratoAtual();
  const html = '<div class="lista">' + D.modelos.map(m =>
    '<div class="item' + (m.id === c.modeloId ? " ativo" : "") + '" data-id="' + m.id + '">' +

      contratoAtual().modeloId = m.id; salvar(); montarFormulario(); renderizar(true); fecharModal();

    }else if(acao === "copiar"){

      if(!confirm("Apagar o modelo \"" + m.nome + "\"?")) return;
      D.modelos = D.modelos.filter(x => x.id !== m.id);
      D.contratos.forEach(ct => { if(ct.modeloId === m.id) ct.modeloId = D.modelos[0].id; });
      salvar(true); montarFormulario(); renderizar(true); telaModelos();
    }
  };
}

function telaBackup(){
  const html = "<p style='margin-top:0'>Os contratos ficam guardados <b>neste navegador</b>. " +

    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="btn primario" id="bkExp">⬇️ Exportar backup (.json)</button>' +
    '<button class="btn" id="bkImp">⬆️ Importar backup</button>' +

    D.modelos.length + " modelo(s) guardados.</p>";
  abrirModal("Backup", html, [{texto:"Fechar"}]);
  $("#bkExp").onclick = () => {
    const b = new Blob([JSON.stringify(D, null, 1)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "backup-contratos-" + hojeISO() + ".json";
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);

  $("#bkArq").onchange = e => {
    const f = e.target.files[0]; if(!f) return;

        if(!novo.modelos || !novo.contratos) throw new Error("arquivo não parece um backup");
        if(!confirm("Isso substitui TUDO que está salvo agora (" + D.contratos.length +
          " contrato(s)) pelo backup (" + novo.contratos.length + " contrato(s)). Continuar?")) return;

        torrada("Backup restaurado.");

  };

  $("#painel").addEventListener("input", aoDigitar);
  $("#painel").addEventListener("change", aoDigitar);
  $("#btNovo").onclick = () => { novoContrato(); torrada("Contrato novo criado."); };
  $("#btAbrir").onclick = telaContratos;
  $("#btPdf").onclick = baixarPDF;
  $("#btImprimir").onclick = () => {
    const faltam = $$("#paginas .vazio").length;
    if(faltam && !confirm("Faltam " + faltam + " campo(s) — eles vão sair marcados em amarelo.\n\nImprimir mesmo assim?")) return;
    window.print();
  };
  $("#btTexto").onclick = () => {
    const c = contratoAtual();
    abrirModal("Editar o texto do contrato",
      "<div style='display:grid;gap:10px'>" +
      "<button class='btn' id='edProprio' style='justify-content:flex-start;padding:12px'>" +
      "<b>Só este contrato</b><br><small style='color:var(--tinta-fraca)'>Escreve livre em cima do texto do " +
      esc(c.dados.nome || "cliente") + ". O modelo continua igual.</small></button>" +
      "<button class='btn' id='edModelo' style='justify-content:flex-start;padding:12px'>" +
      "<b>O modelo inteiro</b><br><small style='color:var(--tinta-fraca)'>Muda o texto padrão, com os {{campos}}. " +
      "Vale para todos os contratos deste modelo.</small></button></div>", [{texto:"Cancelar"}]);
    $("#edProprio").onclick = () => { fecharModal(); abrirEditor("proprio"); };
    $("#edModelo").onclick = () => { fecharModal(); abrirEditor("modelo"); };
  };
  $("#btMenu").onclick = () => {
    abrirModal("Mais opções",
      "<div style='display:grid;gap:8px'>" +
      "<button class='btn' id='mnCfg'>⚙️ Configurações (nome do arquivo, timbrado)</button>" +
      "<button class='btn' id='mnMod'>📄 Modelos de contrato</button>" +
      "<button class='btn' id='mnNota'>🧠 Gerar a nota do evento pro Obsidian</button>" +
      "<button class='btn' id='mnBkp'>💾 Backup (exportar / importar)</button>" +
      "<button class='btn' id='mnAju'>❓ Como usar</button></div>", [{texto:"Fechar"}]);
    $("#mnCfg").onclick = () => { fecharModal(); telaConfig(); };
    $("#mnMod").onclick = () => { fecharModal(); telaModelos(); };
    $("#mnNota").onclick = () => { fecharModal(); telaNota(); };
    $("#mnBkp").onclick = () => { fecharModal(); telaBackup(); };
    $("#mnAju").onclick = () => { fecharModal(); telaAjuda(); };
  };
  $("#modalFechar").onclick = fecharModal;
  $("#modal").onclick = e => { if(e.target.id === "modal") fecharModal(); };

  $("#btVoltarModelo").onclick = () => {
    if(!confirm("Descartar o texto próprio e voltar ao modelo? O que você escreveu à mão se perde.")) return;
    const c = contratoAtual(); c.htmlProprio = null;
    salvar(true); montarFormulario(); renderizar(true); torrada("Voltou ao modelo.");
  };
  $("#btEditarProprio").onclick = () => abrirEditor("proprio");

  $("#btCancelarEditor").onclick = fecharEditor;
  $("#btSalvarEditor").onclick = salvarEditor;
  $("#btRestaurarModelo").onclick = () => {
    if(editorAlvo === "modelo"){
      if(!confirm("Voltar este modelo ao texto original de fábrica?")) return;
      $("#folhaEdicao").innerHTML = decorar(MODELO_PADRAO);
    }else{
      if(!confirm("Descartar o texto próprio e voltar de vez ao modelo?\n\n" +
        "O contrato volta a ser preenchido pelo formulário.")) return;
      const c = contratoAtual();
      c.htmlProprio = null; c.alterado = Date.now();
      salvar(true); fecharEditor(); montarFormulario(); renderizar(true);
      torrada("Voltou ao modelo.");
    }
  };
  $("#btQuebra").onclick = () => {
    $("#folhaEdicao").focus();
    document.execCommand("insertHTML", false, '<div class="quebra"></div><p><br></p>');
  };
  $$("#editorBarra [data-cmd]").forEach(b => {
    b.onmousedown = e => e.preventDefault();
    b.onclick = () => document.execCommand(b.dataset.cmd, false, null);
  });
  // colar do Word/WhatsApp/PDF entra como texto limpo, sem fonte e cor de fora
  $("#folhaEdicao").addEventListener("paste", e => {
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData("text/plain");
    const seguro = esc(t).replace(/\r?\n\r?\n+/g, "</p><p>").replace(/\r?\n/g, "<br>");
    document.execCommand("insertHTML", false, seguro);
  });

  $("#btZoomMais").onclick = () => { zoomAuto = false; zoom = Math.min(2, zoom + 0.1); aplicarZoom(); };
  $("#btZoomMenos").onclick = () => { zoomAuto = false; zoom = Math.max(0.2, zoom - 0.1); aplicarZoom(); };
  $("#btZoomAjustar").onclick = () => { zoomAuto = true; aplicarZoom(); };
  window.addEventListener("resize", () => { if(zoomAuto) aplicarZoom(); });

  document.addEventListener("keydown", e => {
    if(e.key === "Escape"){
      if($("#capaEditor").classList.contains("aberto")) return;
      fecharModal();
    }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){
      e.preventDefault();
      if($("#capaEditor").classList.contains("aberto")) salvarEditor(); else baixarPDF();
    }
  });

  // arrastar a divisória
  let arrastando = false;
  $("#puxador").addEventListener("mousedown", () => { arrastando = true; document.body.style.userSelect = "none"; });
  window.addEventListener("mousemove", e => {
    if(!arrastando) return;
    const l = Math.max(300, Math.min(window.innerWidth * 0.6, e.clientX));
    document.documentElement.style.setProperty("--painel", l + "px");
    if(zoomAuto) aplicarZoom();
  });
  window.addEventListener("mouseup", () => { arrastando = false; document.body.style.userSelect = ""; });
}

/* -------------------------------------------------------------- início */
function iniciar(){
  carregar();
  if(!D.contratos.length || !D.contratos.find(c => c.id === D.atual)) novoContrato(false);
  ligarTudo();
  montarFormulario();
  renderizar(true);
  if(semArmazenamento)
    torrada("Este navegador não deixa salvar dados nesta página. Exporte um backup antes de fechar.", true);
  else if(dadosCorrompidos)
    abrirModal("Os dados guardados estavam ilegíveis",
      "<p style='margin-top:0'>O app não conseguiu ler os contratos que estavam salvos neste navegador " +
      "e começou do zero. <b>Nada foi apagado</b> — o conteúdo antigo ficou guardado numa cópia de socorro.</p>" +
      "<p>Se você tem um backup <code>.json</code>, restaure por <b>⋯ → Backup → Importar</b>.</p>",
      [{texto:"Entendi", cls:"primario"}]);
  marcarEstado(semArmazenamento ? "⚠️ não está salvando" : "salvo");
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", iniciar);
else iniciar();
</script>
