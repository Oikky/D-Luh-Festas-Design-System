One-line: the sticky page header — title in Playfair, search in the middle, utilities and the user chip on the right.

```jsx
<Topbar title="Pedidos" subtitle="Gestão de pedidos D'Luh Festas"
  search={<SearchInput value={q} onChange={…} />}
  actions={<><Button variant="ghost" icon="refresh-cw">Atualizar</Button><IconButton icon="bell" label="Notificações" badge /></>}
  user={<UserChip name="Holland" role="Gerente" />} />
```

It wraps on mobile: the search drops to its own full-width row below the title.
