<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Actions</title><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px 20px;background:var(--color-bg);font-family:var(--font-ui);color:var(--text-strong)}.row{display:flex;gap:10px;flex-wrap:wrap}.lbl{font-size:10.5px;font-weight:600;color:var(--text-muted);letter-spacing:.4px;text-transform:uppercase}.mono{font-family:var(--font-ui);font-variant-numeric:tabular-nums}</style></head><body><div class="row" style="gap:8px">
<span style="display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:var(--radius-sm);background:var(--action-charge-entry);color:#fff;font-size:12.5px;font-weight:600">Cobrar entrada</span><span style="display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:var(--radius-sm);background:var(--action-charge-total);color:#fff;font-size:12.5px;font-weight:600">Cobrar total</span><span style="display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:var(--radius-sm);background:var(--action-delivered);color:#fff;font-size:12.5px;font-weight:600">Marcar entregue</span><span style="display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:var(--radius-sm);background:var(--action-success);color:#fff;font-size:12.5px;font-weight:600">Pagar na retirada</span><span style="display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:var(--radius-sm);background:var(--action-warn);color:#fff;font-size:12.5px;font-weight:600">Notificar alterações</span><span style="display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:var(--radius-sm);background:var(--action-danger);color:#fff;font-size:12.5px;font-weight:600">Apagar</span>
</div><div style="margin-top:12px;font-size:11px;color:var(--text-muted)">Amber <b style="color:var(--action-warn)">--action-warn</b> also tints "Falta R$…", the pagamento-por-fora block and unsent-change pills.</div></body></html>
