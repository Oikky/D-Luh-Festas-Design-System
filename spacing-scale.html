<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Status</title><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px 20px;background:var(--color-bg);font-family:var(--font-ui);color:var(--text-strong)}.row{display:flex;gap:10px;flex-wrap:wrap}.lbl{font-size:10.5px;font-weight:600;color:var(--text-muted);letter-spacing:.4px;text-transform:uppercase}.mono{font-family:var(--font-ui);font-variant-numeric:tabular-nums}</style></head><body><div class="row" style="gap:8px">
<span style="display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:var(--radius-pill);background:var(--status-aguardando-bg);color:var(--status-aguardando-fg);font-size:11.5px;font-weight:600"><span style="width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75"></span>Aguardando confirmação</span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:var(--radius-pill);background:var(--status-confirmado-bg);color:var(--status-confirmado-fg);font-size:11.5px;font-weight:600"><span style="width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75"></span>Esperando pagamento</span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:var(--radius-pill);background:var(--status-preparo-bg);color:var(--status-preparo-fg);font-size:11.5px;font-weight:600"><span style="width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75"></span>Em produção</span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:var(--radius-pill);background:var(--status-pronto-bg);color:var(--status-pronto-fg);font-size:11.5px;font-weight:600"><span style="width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75"></span>Pronto</span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:var(--radius-pill);background:var(--status-saiu-bg);color:var(--status-saiu-fg);font-size:11.5px;font-weight:600"><span style="width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75"></span>Esperando restante</span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:var(--radius-pill);background:var(--status-entregue-bg);color:var(--status-entregue-fg);font-size:11.5px;font-weight:600"><span style="width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75"></span>Finalizado</span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:var(--radius-pill);background:var(--status-cancelado-bg);color:var(--status-cancelado-fg);font-size:11.5px;font-weight:600"><span style="width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75"></span>Cancelado</span>
</div><div style="margin-top:12px;font-size:11px;color:var(--text-muted)">The Status string must match the Coda single-select exactly — a typo fails silently.</div></body></html>
