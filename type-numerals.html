<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px 20px;background:var(--color-bg);font-family:var(--font-ui);color:var(--text-strong)}.row{display:flex;gap:10px;flex-wrap:wrap}.lbl{font-size:10.5px;font-weight:600;color:var(--text-muted);letter-spacing:.4px;text-transform:uppercase}.mono{font-family:var(--font-ui);font-variant-numeric:tabular-nums}</style></head><body><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px 20px;font-size:12px">
<div style="padding:9px 12px;border:1px solid var(--color-border);border-radius:var(--radius-xs);background:var(--color-surface)"><div style="font-weight:600">150ms</div><div style="color:var(--text-muted);font-size:11px;margin-top:2px">hover, border, colour</div><div class="lbl" style="margin-top:3px">--dur-fast</div></div><div style="padding:9px 12px;border:1px solid var(--color-border);border-radius:var(--radius-xs);background:var(--color-surface)"><div style="font-weight:600">250ms</div><div style="color:var(--text-muted);font-size:11px;margin-top:2px">toast, sidebar expand</div><div class="lbl" style="margin-top:3px">--dur-base</div></div><div style="padding:9px 12px;border:1px solid var(--color-border);border-radius:var(--radius-xs);background:var(--color-surface)"><div style="font-weight:600">700ms</div><div style="color:var(--text-muted);font-size:11px;margin-top:2px">spinner sweep</div><div class="lbl" style="margin-top:3px">--dur-slow</div></div><div style="padding:9px 12px;border:1px solid var(--color-border);border-radius:var(--radius-xs);background:var(--color-surface)"><div style="font-weight:600">cubic-bezier(.4,0,.2,1)</div><div style="color:var(--text-muted);font-size:11px;margin-top:2px">everything</div><div class="lbl" style="margin-top:3px">--ease-standard</div></div><div style="padding:9px 12px;border:1px solid var(--color-border);border-radius:var(--radius-xs);background:var(--color-surface)"><div style="font-weight:600">.98</div><div style="color:var(--text-muted);font-size:11px;margin-top:2px">press feedback</div><div class="lbl" style="margin-top:3px">--press-scale</div></div><div style="padding:9px 12px;border:1px solid var(--color-border);border-radius:var(--radius-xs);background:var(--color-surface)"><div style="font-weight:600">.87</div><div style="color:var(--text-muted);font-size:11px;margin-top:2px">solid button hover</div><div class="lbl" style="margin-top:3px">--hover-opacity</div></div>
</div></body></html>
