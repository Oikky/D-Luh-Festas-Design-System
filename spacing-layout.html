<!-- @dsCard group="Colors" viewport="700x170" name="Semantic aliases" subtitle="What to reach for instead of a raw scale value" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Semantic</title><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px 20px;background:var(--color-bg);font-family:var(--font-ui);color:var(--text-strong)}.row{display:flex;gap:10px;flex-wrap:wrap}.lbl{font-size:10.5px;font-weight:600;color:var(--text-muted);letter-spacing:.4px;text-transform:uppercase}.mono{font-family:var(--font-ui);font-variant-numeric:tabular-nums}</style></head><body><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px;font-size:12px">
<div style="display:flex;align-items:center;gap:9px"><span style="width:22px;height:22px;border-radius:6px;background:var(--color-bg);border:1px solid var(--color-border);flex:0 0 auto"></span><span style="font-weight:600">--color-bg</span><span style="color:var(--text-muted)">page background</span></div><div style="display:flex;align-items:center;gap:9px"><span style="width:22px;height:22px;border-radius:6px;background:var(--color-surface);border:1px solid var(--color-border);flex:0 0 auto"></span><span style="font-weight:600">--color-surface</span><span style="color:var(--text-muted)">card / panel</span></div><div style="display:flex;align-items:center;gap:9px"><span style="width:22px;height:22px;border-radius:6px;background:var(--color-surface-2);border:1px solid var(--color-border);flex:0 0 auto"></span><span style="font-weight:600">--color-surface-2</span><span style="color:var(--text-muted)">footer strip, inputs</span></div><div style="display:flex;align-items:center;gap:9px"><span style="width:22px;height:22px;border-radius:6px;background:var(--color-border);border:1px solid var(--color-border);flex:0 0 auto"></span><span style="font-weight:600">--color-border</span><span style="color:var(--text-muted)">hairline</span></div><div style="display:flex;align-items:center;gap:9px"><span style="width:22px;height:22px;border-radius:6px;background:var(--text-strong);border:1px solid var(--color-border);flex:0 0 auto"></span><span style="font-weight:600">--text-strong</span><span style="color:var(--text-muted)">headings, amounts</span></div><div style="display:flex;align-items:center;gap:9px"><span style="width:22px;height:22px;border-radius:6px;background:var(--text-body);border:1px solid var(--color-border);flex:0 0 auto"></span><span style="font-weight:600">--text-body</span><span style="color:var(--text-muted)">running text</span></div><div style="display:flex;align-items:center;gap:9px"><span style="width:22px;height:22px;border-radius:6px;background:var(--text-muted);border:1px solid var(--color-border);flex:0 0 auto"></span><span style="font-weight:600">--text-muted</span><span style="color:var(--text-muted)">labels, captions</span></div><div style="display:flex;align-items:center;gap:9px"><span style="width:22px;height:22px;border-radius:6px;background:var(--color-accent);border:1px solid var(--color-border);flex:0 0 auto"></span><span style="font-weight:600">--color-accent</span><span style="color:var(--text-muted)">primary action</span></div>
</div></body></html>
